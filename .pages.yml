# Painel de edição da Lily Cestas (Pages CMS, https://app.pagescms.org)
# Tudo o que aparece no painel está definido aqui. Quem edita só usa o formulário.

media:
  input: assets/produtos
  output: /assets/produtos
  extensions: [jpg, jpeg, png, webp, heic]

content:
  # ------------------------------------------------------------------ PRODUTOS
  - name: produtos
    label: Produtos
    type: collection
    path: data/produtos
    filename: '{primary}.json'
    extension: json
    format: json
    view:
      fields: [nome, categoria, preco, status]
      primary: nome
    fields:
      - name: nome
        label: Nome do produto
        type: string
        required: true
      - name: categoria
        label: Categoria
        type: reference
        required: true
        description: Escolha a categoria onde o produto aparece no site.
        options:
          collection: categorias
          search: nome
          value: '{fields.chave}'
          label: '{fields.nome}'
      - name: preco
        label: Preço (R$)
        type: number
        required: true
        description: Preço normal do produto. Exemplo 89.90 (use ponto, sem R$).
      - name: preco_promocional
        label: Preço promocional (R$)
        type: number
        description: Opcional. Se preencher, o site mostra o preço antigo riscado e vende por este valor. Precisa ser menor que o preço normal. Apague para encerrar a promoção.
      - name: status
        label: Situação
        type: select
        required: true
        default: ativo
        description: Ativo = à venda. Esgotado = aparece mas sem botão de compra. Oculto = some do site (sem apagar).
        options:
          values:
            - { value: ativo, label: Ativo (à venda) }
            - { value: esgotado, label: Esgotado }
            - { value: oculto, label: Oculto (não aparece no site) }
      - name: foto
        label: Foto principal
        type: image
        required: true
        description: Envie uma foto nítida, de preferência na horizontal. O site reduz o tamanho sozinho.
      - name: alt
        label: Descrição da foto (opcional)
        type: string
        description: Frase curta que descreve a foto. Ajuda pessoas com deficiência visual e o Google.
      - name: selo
        label: Selo (opcional)
        type: string
        description: Faixa curta sobre a foto, como "Mais vendida" ou "Novo". Deixe vazio se não quiser.
      - name: descricao
        label: Descrição curta
        type: text
        description: Duas ou três frases sobre o que vem no produto.
      - name: personalizacao
        label: O que dá para personalizar
        type: string
        description: Exemplo - Nome na xícara + palavra 3D + 3 fotos Polaroid.
      - name: inclui
        label: O que vem no produto
        type: string
        list: true
        description: Um item por linha (clique em Adicionar para incluir mais).
      - name: ordem
        label: Ordem na vitrine
        type: number
        default: 50
        description: Números menores aparecem primeiro (1 aparece antes de 2).
      - name: destaque
        label: Destaque
        type: boolean
        default: false
        description: Produtos em destaque aparecem nas páginas de cada cidade.
      - name: quiz
        label: Aparece no quiz para quem?
        type: select
        list: true
        description: Opcional. Ajuda o Concierge (quiz de 15 segundos) a recomendar este produto. Clique em Add an item e escolha uma opção por vez.
        options:
          values:
            - { value: amor, label: Para amor / namorado(a) / casal }
            - { value: mae, label: Para mãe / avó / família }
            - { value: amiga, label: Para amiga / madrinha / aniversário }
            - { value: decor, label: Para mim / decoração }
            - { value: completa, label: Combina com cesta completa }
            - { value: iluminada, label: Combina com emoção iluminada (3D + Polaroid) }
            - { value: louca, label: Combina com louça personalizada }

  # ------------------------------------------------------------------ CATEGORIAS
  - name: categorias
    label: Categorias
    type: collection
    path: data/categorias
    filename: '{primary}.json'
    extension: json
    format: json
    view:
      fields: [nome, ordem, ativa]
      primary: nome
    fields:
      - name: nome
        label: Nome da categoria
        type: string
        required: true
        description: Exemplo - Cestas de Presente.
      - name: chave
        label: Código interno
        type: string
        required: true
        description: Apenas letras minúsculas, sem espaço nem acento (exemplo - velas). Não mude depois de criada.
      - name: ativa
        label: Mostrar no site
        type: boolean
        default: true
        description: Desligue para esconder a categoria e os produtos dela.
      - name: ordem
        label: Ordem no site
        type: number
        default: 50
      - name: nome_curto
        label: Nome curto (botões de filtro)
        type: string
        description: Exemplo - Cestas & Boxes.
      - name: icone
        label: Emoji
        type: string
        description: Um emoji para o botão de filtro, como 🧺 ou ☕.
      - name: nome_tile
        label: Nome no cartão da primeira tela
        type: string
      - name: foto
        label: Foto do cartão da categoria
        type: image
        description: Foto que aparece no cartão da categoria na primeira tela.
      - name: eh_cesta
        label: É uma categoria de cestas/boxes?
        type: boolean
        default: false
        description: Ligue só para cestas e boxes. Eles viram a base do presente no Estúdio ao vivo.
      - name: frase_apoio
        label: Frase de apoio
        type: text
      - name: pagina_url
        label: Endereço da página (SEO)
        type: string
        description: Parte final do endereço. Exemplo - velas-aromaticas gera lilycestas.com.br/velas-aromaticas/
      - name: pagina_titulo
        label: Título no Google
        type: string
        description: Até 60 caracteres. Exemplo - Velas Aromáticas Personalizadas | Lily Cestas.
      - name: pagina_descricao
        label: Descrição no Google
        type: text
        description: Até 160 caracteres. Fale do produto e das cidades atendidas.
      - name: pagina_h1
        label: Título da página
        type: string
      - name: pagina_intro
        label: Texto de abertura da página
        type: text
      - name: pagina_secoes
        label: Seções de texto da página
        type: object
        list: true
        fields:
          - { name: titulo, label: Título da seção, type: string }
          - { name: texto, label: Texto, type: text }

  # ------------------------------------------------------------------ BANNERS
  - name: banners
    label: Banners da home
    type: collection
    path: data/banners
    filename: '{primary}.json'
    extension: json
    format: json
    view:
      fields: [nome, ativo, ordem]
      primary: nome
    fields:
      - { name: nome, label: Nome do banner (só para você se organizar), type: string, required: true }
      - { name: ativo, label: Mostrar na home, type: boolean, default: true, description: "Desligue para tirar o banner do site sem apagar." }
      - { name: ordem, label: Ordem (1 aparece primeiro), type: number, default: 10 }
      - name: imagem_web
        label: Imagem para computador (1600 x 320 px)
        type: image
        options: { path: assets/banners }
        description: "Tamanho ideal 1600 x 320 px (proporção 5 para 1). Deixe o texto importante no centro, porque as pontas podem ser cortadas em telas diferentes. Se não enviar imagem, o site monta um banner com o texto abaixo."
      - name: imagem_mobile
        label: Imagem para celular (750 x 300 px)
        type: image
        options: { path: assets/banners }
        description: "Tamanho ideal 750 x 300 px (proporção 5 para 2). Envie sempre as duas versões, para o banner não ficar cortado no celular."
      - { name: alt, label: Descrição da imagem (para acessibilidade e Google), type: string, description: "Uma frase curta, por exemplo: Cestas de Natal com entrega grátis." }
      - { name: link, label: Para onde o banner leva, type: string, description: "Exemplos: #catalogo (lista de presentes), /cesta-de-natal/ (página do Natal) ou https://wa.me/55... Deixe vazio para não ter clique." }
      - { name: titulo, label: Título (usado se não houver imagem), type: string, description: "Pode usar {frete}, {minimo}, {brinde} e {pix}. O site troca pelos valores das Configurações." }
      - { name: subtitulo, label: Frase de apoio (usada se não houver imagem), type: string }
      - { name: botao, label: Texto do botão (usado se não houver imagem), type: string }
      - { name: icone, label: Emoji (usado se não houver imagem), type: string }
      - name: cor
        label: Cor do banner de texto
        type: select
        default: rose
        options:
          values:
            - { value: rose, label: Rosé (claro com texto branco) }
            - { value: vinho, label: Vinho (escuro com texto branco) }
            - { value: creme, label: Creme (claro com texto rosé) }

  # ------------------------------------------------------------------ ADICIONAIS
  - name: adicionais
    label: Adicionais (cartão, Polaroid)
    type: collection
    path: data/adicionais
    filename: '{primary}.json'
    extension: json
    format: json
    view:
      fields: [nome, preco, preco_promocional, status]
      primary: nome
    fields:
      - { name: nome, label: Nome do adicional, type: string, required: true }
      - { name: preco, label: Preço normal (R$), type: number, required: true, description: "Exemplo 8.00" }
      - { name: preco_promocional, label: Preço promocional (R$), type: number, description: "Opcional. O site mostra o preço normal riscado e vende por este valor." }
      - name: status
        label: Situação
        type: select
        default: ativo
        options:
          values: [{ value: ativo, label: Ativo }, { value: oculto, label: Oculto }]
      - name: pede
        label: O que pedir ao cliente
        type: select
        default: nada
        description: Frase = campo para escrever a mensagem. Foto = avisa que a foto vai pelo WhatsApp.
        options:
          values: [{ value: frase, label: Frase }, { value: foto, label: Foto pelo WhatsApp }, { value: nada, label: Nada }]
      - { name: descricao, label: Descrição, type: text }
      - { name: foto, label: Foto, type: image }
      - { name: ordem, label: Ordem, type: number, default: 50 }

  # ------------------------------------------------------------------ PERGUNTAS FREQUENTES
  - name: faq
    label: Perguntas frequentes
    type: file
    path: data/faq.json
    format: json
    fields:
      - name: perguntas
        label: Perguntas
        type: object
        list: true
        fields:
          - { name: pergunta, label: Pergunta, type: string, required: true }
          - { name: resposta, label: Resposta, type: text, required: true }

  # ------------------------------------------------------------------ PÁGINA DE CANECAS
  - name: canecas
    label: Página de Canecas (/canecas/)
    type: file
    path: data/canecas.json
    format: json
    fields:
      - { name: ativa, label: Página no ar, type: boolean, default: true, description: "Desligue para a página sair do ar." }
      - { name: noindex, label: Escondida do Google por enquanto, type: boolean, default: true, description: "Ligado = o Google ainda não indexa a página. Desligue quando ela estiver pronta e aprovada." }
      - { name: h1, label: Título da página, type: string }
      - { name: intro, label: Texto de abertura, type: text }
      - { name: botao_principal, label: Texto do botão principal, type: string }
      - name: banners
        label: Banners da página de canecas
        type: object
        list: true
        description: "Aparecem em carrossel abaixo do título. Envie sempre as duas versões."
        fields:
          - { name: ativo, label: Mostrar, type: boolean, default: true }
          - { name: imagem_web, label: Imagem para computador (1600 x 320 px), type: image, options: { path: assets/banners } }
          - { name: imagem_mobile, label: Imagem para celular (750 x 300 px), type: image, options: { path: assets/banners } }
          - { name: alt, label: Descrição da imagem, type: string }
          - { name: link, label: Para onde leva, type: string, description: "Exemplos: #temas, #produtos, /catalogo/ ou https://wa.me/55... Vazio = sem clique." }
      - { name: temas_titulo, label: Título da seção de temas, type: string }
      - { name: temas_texto, label: Frase abaixo do título dos temas, type: string }
      - name: temas
        label: Temas de canecas
        type: object
        list: true
        description: "Cada tema vira um cartão que leva ao WhatsApp com a mensagem já pronta. Para esconder um tema sem apagar, desligue 'Mostrar'."
        fields:
          - { name: ativo, label: Mostrar, type: boolean, default: true }
          - { name: nome, label: Nome do tema, type: string, required: true }
          - { name: emoji, label: Emoji (usado se não houver foto), type: string }
          - { name: foto, label: Foto ou arte do tema (quadrada), type: image, options: { path: assets/canecas } }
          - { name: alt, label: Descrição da foto, type: string }
          - { name: descricao, label: Descrição curta, type: text }
      - name: passos
        label: Como funciona (passos)
        type: object
        list: true
        fields:
          - { name: titulo, label: Título, type: string, required: true }
          - { name: texto, label: Texto, type: text }
      - { name: produtos_titulo, label: Título da seção de produtos, type: string }
      - { name: produtos, label: Produtos mostrados na página, type: reference, list: true, options: { collection: produtos, search: nome, value: '{fields.nome}', label: '{fields.nome}' }, description: "Os produtos da categoria Canecas Personalizadas entram sozinhos. Aqui você acrescenta outros." }
      - name: secoes
        label: Textos da página (ajudam no Google)
        type: object
        list: true
        fields:
          - { name: titulo, label: Título, type: string, required: true }
          - { name: texto, label: Texto, type: text }
      - name: faq
        label: Perguntas frequentes
        type: object
        list: true
        fields:
          - { name: pergunta, label: Pergunta, type: string, required: true }
          - { name: resposta, label: Resposta, type: text, required: true }
      - { name: cta_titulo, label: Título da faixa final, type: string }
      - { name: cta_texto, label: Texto da faixa final, type: text }
      - { name: titulo_seo, label: Título no Google, type: string }
      - { name: descricao_seo, label: Descrição no Google, type: text }

  # ------------------------------------------------------------------ CONFIGURAÇÕES
  - name: config
    label: Configurações da loja
    type: file
    path: data/config.json
    format: json
    fields:
      - { name: whatsapp, label: WhatsApp (com DDD, só números), type: string, description: Exemplo 5511914955434 }
      - { name: instagram, label: Link do Instagram, type: string }
      - { name: ifood_url, label: Link da loja no iFood, type: string, description: Endereço da Lily Cestas no iFood. Aparece no bloco "Prefere comprar pelo iFood?". }
      - { name: pix_desconto, label: Desconto no Pix (%), type: number, description: Exemplo 5 }
      - { name: cidades_entrega, label: Cidades atendidas na entrega, type: string, list: true, description: "Usadas para validar o CEP no checkout. Alphaville e Polvilho entram em Barueri, Santana de Parnaíba e Cajamar." }
      - { name: entrega_gratis_a_partir, label: Entrega grátis a partir de (R$), type: number, description: "Pedidos com este valor ou mais (soma dos produtos, sem o desconto do Pix) não pagam entrega. Exemplo 125." }
      - { name: pedido_minimo, label: Pedido mínimo (R$), type: number, description: "Abaixo disso o site não deixa finalizar o pedido. Exemplo 35." }
      - { name: taxa_entrega, label: Taxa de entrega abaixo do valor de entrega grátis (R$), type: number, description: "Cobrada só em pedidos menores que o valor de entrega grátis. Exemplo 15." }
      - { name: brinde1_valor, label: Brinde - pedido a partir de (R$), type: number }
      - { name: brinde1_nome, label: Brinde - nome, type: string }
      - { name: ga4_id, label: Código do Google Analytics (G-XXXXXXXXXX), type: string, description: "Opcional. Cole aqui o ID de métricas do Google Analytics 4 (começa com G-). Vazio = sem medição." }
      - { name: popup_brinde_ativo, label: Pop-up do brinde (ligado), type: boolean, description: "Mostra um aviso do chaveiro de brinde alguns segundos depois da pessoa entrar. Aparece uma vez a cada 7 dias para cada visitante." }
      - { name: popup_brinde_segundos, label: Pop-up do brinde - esperar quantos segundos, type: number }
      - { name: brinde_opcao1_nome, label: Brinde - nome do chaveiro 1 (foto do chaveiro de brinde acima), type: string }
      - { name: brinde_opcao2_nome, label: Brinde - nome do chaveiro 2, type: string }
      - { name: foto_chaveiro_2, label: Brinde - foto do chaveiro 2, type: image, options: { path: assets/brinde }, description: Aparece no pop-up do brinde. }
      - { name: nome_proprietaria, label: Proprietária - nome (rodapé), type: string }
      - { name: cargo_proprietaria, label: Proprietária - descrição curta (rodapé), type: string }
      - { name: foto_proprietaria, label: Proprietária - foto (rodapé, círculo), type: image, options: { path: assets/equipe }, description: Foto de rosto, quadrada ou vertical. }
      - { name: clarity_id, label: Código do Microsoft Clarity, type: string, description: "Opcional. ID do projeto no Clarity (letras e números, ex. z2zt388utc). Mostra gravações e mapas de calor do uso do site. Vazio = desligado." }
      - { name: foto_chaveiro_simples, label: Foto do chaveiro de brinde (fundo transparente), type: image, description: Aparece no cartão de brinde da primeira tela. Use foto sem fundo (PNG). }
      - { name: foto_estudio_litofania, label: Foto da prévia da litofania (Estúdio), type: image }
      - { name: foto_estudio_polaroid, label: Foto da prévia da Polaroid (Estúdio), type: image }
      - name: loja_no_ar
        label: Loja completa como página principal
        type: boolean
        description: ATENÇÃO - só ligue quando combinado. Desligado, o site mostra a página de links (WhatsApp e iFood) e a loja fica em /home/.
